services:
  backend:
    build:
      context: ./backend
    container_name: spendsmart-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - analytics
    command: sh -c "npx prisma generate && npm run dev"

  frontend:
    build:
      context: ./frontend
    container_name: spendsmart-frontend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

  analytics:
    build:
      context: ./analytics
    container_name: spendsmart-analytics
    ports:
      - "8000:8000"
    env_file:
      - ./analytics/.env
    volumes:
      - ./analytics:/app
