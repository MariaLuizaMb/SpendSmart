services:
  redis:
    image: redis:7-alpine
    container_name: spendsmart-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: spendsmart-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      QUEUE_PREFIX: ${QUEUE_PREFIX:-spendsmart}
      QUEUE_DISABLED: ${QUEUE_DISABLED:-false}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - analytics
      - redis
    command: sh -c "npx prisma generate && npm run dev"

  frontend:
    build:
      context: ./frontend
    container_name: spendsmart-frontend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

  analytics:
    build:
      context: ./analytics
    container_name: spendsmart-analytics
    ports:
      - "8000:8000"
    env_file:
      - ./analytics/.env
    volumes:
      - ./analytics:/app
