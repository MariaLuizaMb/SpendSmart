services:
  # ─────────────────────────────────────────
  # BACKEND — Web Service (Docker)
  # ─────────────────────────────────────────
  - type: web
    name: spendsmart-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: QUEUE_PREFIX
        value: spendsmart
      - key: QUEUE_DISABLED
        value: "false"
      - key: CORS_ORIGIN
        value: https://spendsmart-frontend.onrender.com
      - key: ANALYTICS_API_URL
        value: https://spendsmart-analytics.onrender.com
      - key: ANALYTICS_API_KEY
        fromService:
          type: web
          name: spendsmart-analytics
          envVarKey: ANALYTICS_API_KEY
      - key: JWT_SECRET
        generateValue: true
      - key: DIRECT_URL
        sync: false

  # ─────────────────────────────────────────
  # ANALYTICS — Web Service (Docker), protegido por API Key
  # ─────────────────────────────────────────
  - type: web
    name: spendsmart-analytics
    runtime: docker
    dockerfilePath: ./analytics/Dockerfile
    dockerContext: ./analytics
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANALYTICS_API_KEY
        generateValue: true

  # ─────────────────────────────────────────
  # FRONTEND — Static Site
  # ─────────────────────────────────────────
  - type: web
    name: spendsmart-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://spendsmart-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
